{% extends "base.html" %}
{% block content %}
<div class="row mb-4">
    <div class="col-md-8 mx-auto">
        <form method="GET" action="{{ url_for('index') }}" class="input-group">
            <input type="text" name="query" class="form-control" placeholder="Search by title or ingredients..." value="{{ query }}">
            <select name="category" class="form-select">
                <option value="">All Categories</option>
                <option value="Italian" {% if category == 'Italian' %}selected{% endif %}>Italian</option>
                <option value="Breakfast" {% if category == 'Breakfast' %}selected{% endif %}>Breakfast</option>
                <option value="Dessert" {% if category == 'Dessert' %}selected{% endif %}>Dessert</option>
                <option value="Mexican" {% if category == 'Mexican' %}selected{% endif %}>Mexican</option>
                <option value="Asian" {% if category == 'Asian' %}selected{% endif %}>Asian</option>
            </select>
            <button class="btn btn-primary" type="submit">Search</button>
        </form>
    </div>
</div>
<h2 class="mb-4">All Recipes</h2>
<div class="row">
    {% for recipe in recipes %}
        <div class="col-md-4 mb-3">
            <div class="card h-100 shadow-sm">
                <div class="card-body">
                    <h5 class="card-title">{{ recipe.title }}</h5>
                    <h6 class="card-subtitle mb-2 text-muted">Category: {{ recipe.category }}</h6>
                    <p class="card-text">Duration: {{ recipe.duration }}</p>
                    <a href="{{ url_for('recipe_detail', recipe_id=recipe.id) }}" class="btn btn-primary btn-sm">View Recipe</a>
                </div>
            </div>
        </div>
    {% endfor %}
</div>
{% endblock %}
