<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Workshops - Coco's Recipes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .navbar-purple { background-color: #6f42c1 !important; }
        .btn-purple { background-color: #6f42c1; color: white; }
        .btn-purple:hover { background-color: #5a3298; color: white; }
    </style>
</head>
<body class="bg-light">

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark navbar-purple mb-4 shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="{{ url_for('index') }}">🧁🍝 Coco's Recipes</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="{{ url_for('index') }}">Recipes</a>
                <a class="nav-link active" href="{{ url_for('courses') }}">Workshops</a>
                <a class="nav-link text-warning" href="{{ url_for('logout') }}">Logout</a>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="container">
        <h2 class="fw-bold mb-4" style="color: #6f42c1;">👩‍🍳 Culinary Workshops & Courses</h2>
        
        <div class="row">
            {% for course in courses %}
                <div class="col-md-4 mb-4">
                    <div class="card shadow-sm border-0 h-100">
                        <div class="card-body d-flex flex-column">
                            <h4 class="card-title fw-bold text-dark">{{ course.title }}</h4>
                            <p class="text-muted small mb-2">Instructor: <strong>{{ course.instructor }}</strong></p>
                            <p class="text-muted small mb-3">Date: <strong>{{ course.date }}</strong></p>
                            <p class="card-text flex-grow-1">{{ course.description }}</p>
                            
                            <form action="{{ url_for('register_course', course_id=course.course_id) }}" method="POST" class="mt-3">
                                <button type="submit" class="btn btn-purple w-100">Register for Workshop</button>
                            </form>
                        </div>
                    </div>
                </div>
            {% else %}
                <div class="col-12 text-center py-5">
                    <p class="text-muted">No workshops available right now. Check back soon!</p>
                </div>
            {% endfor %}
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
