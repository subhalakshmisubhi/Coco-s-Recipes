{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-7">
        <div class="card shadow p-4">
            <h2 class="fw-bold mb-4 text-dark">Add New Recipe</h2>
            <form method="POST">
                <div class="mb-3"><label class="form-label fw-bold">Recipe Title</label><input type="text" name="title" class="form-control" required></div>
                <div class="row">
                    <div class="col-md-6 mb-3"><label class="form-label fw-bold">Prep/Cook Time</label><input type="text" name="time" class="form-control" placeholder="e.g. 30 mins"></div>
                    <div class="col-md-6 mb-3"><label class="form-label fw-bold">Calories</label><input type="text" name="calories" class="form-control" placeholder="e.g. 450"></div>
                </div>
                <div class="mb-3">
    <label class="form-label fw-bold">Cuisine / Category</label>
    <select name="cuisine" class="form-select">
        <option value="Italian">Italian</option>
        <option value="Mexican">Mexican</option>
        <option value="Asian">Asian</option>
        <option value="American">American</option>
        <option value="Dessert">Dessert</option>
        <option value="Other">Other</option>
    </select>
</div>
                <div class="mb-3"><label class="form-label fw-bold">Ingredients</label><textarea name="ingredients" class="form-control" rows="3" placeholder="List ingredients separated by commas"></textarea></div>
                <div class="mb-4"><label class="form-label fw-bold">Steps</label><textarea name="steps" class="form-control" rows="4" placeholder="Step-by-step instructions"></textarea></div>
                <button type="submit" class="btn btn-custom w-100 py-2">Save Recipe</button>
                <a href="{{ url_for('index') }}" class="btn btn-light w-100 mt-2 text-muted">Cancel</a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
