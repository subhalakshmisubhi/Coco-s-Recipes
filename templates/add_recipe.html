<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Add Recipe - Coco's Recipes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="{{ url_for('index') }}">Coco's Recipes</a>
        </div>
    </nav>

    <div class="container col-md-6 mb-5">
        <div class="mb-3">
            <a href="javascript:history.back()" class="btn btn-secondary btn-sm">&larr; Back</a>
        </div>
        <div class="card shadow-sm p-4">
            <h2 class="mb-4">Add a New Recipe</h2>
            <form action="{{ url_for('add_recipe') }}" method="POST">
                <div class="mb-3">
                    <label for="title" class="form-label">Recipe Title</label>
                    <input type="text" class="form-control" id="title" name="title" required>
                </div>
                <div class="mb-3">
                    <label for="category" class="form-label">Category</label>
                    <input type="text" class="form-control" id="category" name="category" placeholder="e.g. Dessert, Italian" required>
                </div>
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="calories" class="form-label">Calories (kcal)</label>
                        <input type="number" class="form-control" id="calories" name="calories" placeholder="e.g. 350">
                    </div>
                    <div class="col-md-6 mb-3">
                        <label for="duration" class="form-label">Cooking Duration</label>
                        <input type="text" class="form-control" id="duration" name="duration" placeholder="e.g. 45 mins" required>
                    </div>
                </div>
                <div class="mb-3">
                    <label for="ingredients" class="form-label">Ingredients</label>
                    <textarea class="form-control" id="ingredients" name="ingredients" rows="4" required placeholder="List ingredients..."></textarea>
                </div>
                <div class="mb-3">
                    <label for="instructions" class="form-label">Instructions</label>
                    <textarea class="form-control" id="instructions" name="instructions" rows="5" required placeholder="Step-by-step instructions..."></textarea>
                </div>
                <button type="submit" class="btn btn-primary w-100">Save Recipe</button>
            </form>
        </div>
    </div>
</body>
</html>
