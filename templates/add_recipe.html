<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Add Recipe - Coco's Recipes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .navbar-purple { background-color: #6f42c1 !important; }
        .btn-purple { background-color: #6f42c1; color: white; }
        .btn-purple:hover { background-color: #5a3298; color: white; }
    </style>
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark navbar-purple mb-4 shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="{{ url_for('index') }}">🧁🍝 Coco's Recipes</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="{{ url_for('index') }}">Recipes</a>
                <a class="nav-link" href="{{ url_for('courses') }}">Workshops</a>
                <a class="nav-link text-warning" href="{{ url_for('logout') }}">Logout</a>
            </div>
        </div>
    </nav>
    <div class="container" style="max-width: 600px;">
        <div class="card shadow-sm border-0 p-4">
            <h3 class="fw-bold mb-4" style="color: #6f42c1;">➕ Add New Recipe</h3>
            <form method="POST">
                <div class="mb-3"><label class="form-label text-muted small">Recipe Title</label><input type="text" name="title" class="form-control" required></div>
                <div class="row">
                    <div class="col-md-6 mb-3"><label class="form-label text-muted small">Preparation Time</label><input type="text" name="time" class="form-control" placeholder="e.g., 30 mins" required></div>
                    <div class="col-md-6 mb-3"><label class="form-label text-muted small">Calories</label><input type="text" name="calories" class="form-control" placeholder="e.g., 350 kcal" required></div>
                </div>
                <div class="mb-3"><label class="form-label text-muted small">Cuisine Type</label><input type="text" name="cuisine" class="form-control" placeholder="e.g., Italian" required></div>
                <div class="mb-3"><label class="form-label text-muted small">Ingredients</label><textarea name="ingredients" class="form-control" rows="3" required></textarea></div>
                <div class="mb-3"><label class="form-label text-muted small">Steps</label><textarea name="steps" class="form-control" rows="4" required></textarea></div>
                <button type="submit" class="btn btn-purple w-100 py-2">Save Recipe</button>
            </form>
        </div>
    </div>
</body>
</html>
