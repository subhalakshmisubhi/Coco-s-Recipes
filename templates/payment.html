{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow p-4">
            <h3 class="mb-3">Complete Payment</h3>
            <p>Registering for: <strong>{{ workshop_name }}</strong></p>
            <form method="POST">
                <div class="mb-3">
                    <label class="form-label">Cardholder Name (Letters only)</label>
                    <input type="text" name="card_name" class="form-control" onkeypress="return event.charCode >= 65 && event.charCode <= 90 || event.charCode >= 97 && event.charCode <= 122 || event.charCode == 32" placeholder="Subhalakshmi" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Card Number (Numbers only)</label>
                    <input type="text" name="card_number" class="form-control" inputmode="numeric" onkeypress="return event.charCode >= 48 && event.charCode <= 57" placeholder="1234567890123456" maxlength="19" required>
                </div>
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Expiry Date (MM/YY)</label>
                        <input type="text" name="expiry" class="form-control" placeholder="MM/YY" maxlength="5" onkeypress="return (event.charCode >= 48 && event.charCode <= 57) || event.charCode == 47" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">CVV (Numbers only)</label>
                        <input type="password" name="cvv" class="form-control" inputmode="numeric" onkeypress="return event.charCode >= 48 && event.charCode <= 57" placeholder="123" maxlength="4" required>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary w-100">Pay Now & Register</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
