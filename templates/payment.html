{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow p-4">
            <h3 class="mb-3">Complete Payment</h3>
            <p>Registering for: <strong>{{ workshop_name }}</strong></p>
            <form method="POST">
                <div class="mb-3">
                    <label class="form-label">Cardholder Name</label>
                    <input type="text" name="card_name" class="form-control" placeholder="Subhalakshmi" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Card Number</label>
                    <input type="text" name="card_number" class="form-control" placeholder="1234 5678 9012 3456" maxlength="19" required>
                </div>
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Expiry Date</label>
                        <input type="text" name="expiry" class="form-control" placeholder="MM/YY" maxlength="5" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">CVV</label>
                        <input type="password" name="cvv" class="form-control" placeholder="123" maxlength="4" required>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary w-100">Pay Now & Register</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
