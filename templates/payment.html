<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Workshop Checkout - Coco's Recipes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="{{ url_for('index') }}">Coco's Recipes</a>
        </div>
    </nav>

    <div class="container col-md-5 mb-5">
        <div class="mb-3">
            <a href="javascript:history.back()" class="btn btn-outline-secondary btn-sm">&larr; Back</a>
        </div>
        <div class="card shadow-sm p-4">
            <h2 class="mb-3">Workshop Checkout</h2>
            <div class="alert alert-info">
                <strong>Workshop:</strong> {{ course.title }}<br>
                <strong>Mentor:</strong> {{ course.mentor }}<br>
                <strong>Duration:</strong> {{ course.duration }}<br>
                <h4 class="mt-2 text-success">Fee: {{ course.fees }}</h4>
            </div>

            <form action="{{ url_for('course_pay', course_id=course.id) }}" method="POST">
                <div class="mb-3">
                    <label for="card_name" class="form-label">Cardholder Name</label>
                    <input type="text" class="form-control" id="card_name" name="card_name" required placeholder="e.g. Subha">
                </div>
                <div class="mb-3">
                    <label for="card_number" class="form-label">Debit / Credit Card Number</label>
                    <input type="text" class="form-control" id="card_number" name="card_number" required maxlength="16" placeholder="xxxx-xxxx-xxxx-xxxx">
                </div>
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="exp" class="form-label">Expiry Date</label>
                        <input type="text" class="form-control" id="exp" name="exp" required placeholder="MM/YY">
                    </div>
                    <div class="col-md-6 mb-3">
                        <label for="cvv" class="form-label">CVV</label>
                        <input type="password" class="form-control" id="cvv" name="cvv" required maxlength="4" placeholder="123">
                    </div>
                </div>
                <button type="submit" class="btn btn-success w-100 py-2">Pay {{ course.fees }} & Confirm Registration</button>
            </form>
        </div>
    </div>
</body>
</html>
