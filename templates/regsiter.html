<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register - Coco's Recipes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; height: 100vh; display: flex; align-items: center; justify-content: center; }
        .card-box { max-width: 400px; width: 100%; padding: 30px; border-radius: 15px; background: white; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .btn-purple { background-color: #6f42c1; color: white; }
        .btn-purple:hover { background-color: #5a3298; color: white; }
    </style>
</head>
<body>
    <div class="card-box">
        <h3 class="text-center fw-bold mb-4" style="color: #6f42c1;">🧁🍝 Create Account</h3>
        {% if error %}<div class="alert alert-danger py-2 text-center small">{{ error }}</div>{% endif %}
        <form method="POST">
            <div class="mb-3">
                <label class="form-label text-muted small">Username</label>
                <input type="text" name="username" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label text-muted small">Email</label>
                <input type="email" name="email" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label text-muted small">Password</label>
                <input type="password" name="password" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-purple w-100 py-2 mb-3">Register</button>
        </form>
        <div class="text-center">
            <small class="text-muted">Already have an account? <a href="{{ url_for('login') }}" style="color: #6f42c1;">Login here</a></small>
        </div>
    </div>
</body>
</html>
