{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5">
        <div class="card shadow p-4">
            <h3 class="text-center mb-4 text-purple">Login</h3>
            <form method="POST">
                <div class="mb-3"><label class="form-label">Username</label><input type="text" name="username" class="form-control" required></div>
                <div class="mb-3"><label class="form-label">Password</label><input type="password" name="password" class="form-control" required></div>
                <button type="submit" class="btn btn-primary w-100 mb-3">Login</button>
            </form>
            <div class="text-center">
                <a href="{{ url_for('forgot_password') }}" class="text-decoration-none">Forgot Password?</a><br>
                <a href="{{ url_for('register') }}" class="text-decoration-none">Don't have an account? Register here</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
