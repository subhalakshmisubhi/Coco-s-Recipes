<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login - Coco's Kitchen</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; background: linear-gradient(135deg, #ff7e5f, #feb47b); height: 100vh; }
        .card { border-radius: 15px; border: none; }
        .btn-custom { background: #ff7e5f; border: none; color: white; font-weight: 500; }
        .btn-custom:hover { background: #e86d4e; color: white; }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center">
    <div class="card shadow-lg p-4" style="width: 380px;">
        <h3 class="text-center fw-bold mb-1">🍳 Coco's Kitchen</h3>
        <p class="text-center text-muted mb-4 fs-6">Please login to continue</p>
        {% if error %}
            <div class="alert alert-danger py-2 text-center fs-6">{{ error }}</div>
        {% endif %}
        <form method="POST">
            <div class="mb-3">
                <label class="form-label text-muted small fw-bold">Username</label>
                <input type="text" name="username" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label text-muted small fw-bold">Password</label>
                <input type="password" name="password" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-custom w-100 py-2 mt-2">Login</button>
        </form>
    </div>
</body>
</html>
