<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit Recipe - Coco's Recipes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>.navbar-purple { background-color: #6f42c1 !important; } .btn-purple { background-color: #6f42c1; color: white; }</style>
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark navbar-purple mb-4 shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="{{ url_for('index') }}">🧁🍝 Coco's Recipes</a>
        </div>
    </nav>
    <div class="container" style="max-width: 600px;">
        <div class="card shadow-sm border-0 p-4">
            <h2 class="fw-bold mb-4" style="color: #6f42c1;">Edit Recipe</h2>
            <form method="POST">
                <div class="mb-3">
                    <label class="form-label">Recipe Title</label>
                    <input type="text" name="title" class="form-control" value="{{ recipe.title }}" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Cuisine Type</label>
                    <input type="text" name="cuisine" class="form-control" value="{{ recipe.cuisine }}">
                </div>
                <div class="row">
                    <div class="col mb-3">
                        <label class="form-label">Prep Time</label>
                        <input type="text" name="time" class="form-control" value="{{ recipe.time }}">
                    </div>
                    <div class="col mb-3">
                        <label class="form-label">Calories</label>
                        <input type="text" name="calories" class="form-control" value="{{ recipe.calories }}">
                    </div>
                </div>
                <div class="row">
                    <div class="col mb-3">
                        <label class="form-label">Protein</label>
                        <input type="text" name="protein" class="form-control" value="{{ recipe.protein }}">
                    </div>
                    <div class="col mb-3">
                        <label class="form-label">Carbs</label>
                        <input type="text" name="carbs" class="form-control" value="{{ recipe.carbs }}">
                    </div>
                    <div class="col mb-3">
                        <label class="form-label">Fats</label>
                        <input type="text" name="fats" class="form-control" value="{{ recipe.fats }}">
                    </div>
                </div>
                <div class="mb-3">
                    <label class="form-label">Cooking Steps</label>
                    <textarea name="steps" class="form-control" rows="4" required>{{ recipe.steps }}</textarea>
                </div>
                <button type="submit" class="btn btn-purple w-100">Update Recipe</button>
            </form>
        </div>
    </div>
</body>
</html>
