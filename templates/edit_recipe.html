{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-7">
        <div class="card shadow p-4">
            <h2 class="fw-bold mb-4 text-dark">Edit Recipe</h2>
            <form method="POST">
                <div class="mb-3"><label class="form-label fw-bold">Recipe Title</label><input type="text" name="title" class="form-control" value="{{ recipe['title'] }}" required></div>
                <div class="row">
                    <div class="col-md-6 mb-3"><label class="form-label fw-bold">Prep/Cook Time</label><input type="text" name="time" class="form-control" value="{{ recipe['time'] }}"></div>
                    <div class="col-md-6 mb-3"><label class="form-label fw-bold">Calories</label><input type="text" name="calories" class="form-control" value="{{ recipe['calories'] }}"></div>
                </div> <div class="mb-3">
    <label class="form-label fw-bold">Cuisine / Category</label>
    <select name="cuisine" class="form-select">
        <option value="Italian" {% if recipe['cuisine'] == 'Italian' %}selected{% endif %}>Italian</option>
        <option value="Mexican" {% if recipe['cuisine'] == 'Mexican' %}selected{% endif %}>Mexican</option>
        <option value="Asian" {% if recipe['cuisine'] == 'Asian' %}selected{% endif %}>Asian</option>
        <option value="American" {% if recipe['cuisine'] == 'American' %}selected{% endif %}>American</option>
        <option value="Dessert" {% if recipe['cuisine'] == 'Dessert' %}selected{% endif %}>Dessert</option>
        <option value="Other" {% if recipe['cuisine'] == 'Other' %}selected{% endif %}>Other</option>
    </select>
</div>
                <div class="mb-3"><label class="form-label fw-bold">Ingredients</label><textarea name="ingredients" class="form-control" rows="3">{{ recipe['ingredients'] }}</textarea></div>
                <div class="mb-4"><label class="form-label fw-bold">Steps</label><textarea name="steps" class="form-control" rows="4">{{ recipe['steps'] }}</textarea></div>
                <button type="submit" class="btn btn-custom w-100 py-2">Update Recipe</button>
                <a href="{{ url_for('index') }}" class="btn btn-light w-100 mt-2 text-muted">Cancel</a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
